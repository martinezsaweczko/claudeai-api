definitions:
  handlers.chatChoice:
    properties:
      finish_reason:
        enum:
        - stop
        - length
        example: stop
        type: string
      index:
        example: 0
        type: integer
      message:
        $ref: '#/definitions/handlers.chatReplyMessage'
    type: object
  handlers.chatCompletion:
    properties:
      choices:
        items:
          $ref: '#/definitions/handlers.chatChoice'
        type: array
      created:
        type: integer
      id:
        example: chatcmpl-0123456789abcdef01234567
        type: string
      model:
        type: string
      object:
        example: chat.completion
        type: string
      usage:
        $ref: '#/definitions/handlers.chatUsage'
    type: object
  handlers.chatMessageDoc:
    properties:
      content:
        example: Reply with the single word OK
        type: string
      role:
        enum:
        - system
        - developer
        - user
        - assistant
        example: user
        type: string
    type: object
  handlers.chatReplyMessage:
    properties:
      content:
        type: string
      role:
        example: assistant
        type: string
    type: object
  handlers.chatRequestDoc:
    properties:
      messages:
        items:
          $ref: '#/definitions/handlers.chatMessageDoc'
        type: array
      model:
        example: haiku
        type: string
      stream:
        example: false
        type: boolean
    type: object
  handlers.chatUsage:
    properties:
      completion_tokens:
        type: integer
      prompt_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
  handlers.errorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.modelList:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.modelObject'
        type: array
      object:
        example: list
        type: string
    type: object
  handlers.modelObject:
    properties:
      created:
        example: 1700000000
        type: integer
      id:
        example: sonnet
        type: string
      object:
        example: model
        type: string
      owned_by:
        example: anthropic
        type: string
    type: object
  handlers.openAIErrorDetailDoc:
    properties:
      code:
        type: string
      message:
        type: string
      param:
        type: string
      type:
        type: string
    type: object
  handlers.openAIErrorDoc:
    properties:
      error:
        $ref: '#/definitions/handlers.openAIErrorDetailDoc'
    type: object
  handlers.skillItem:
    properties:
      description:
        type: string
      name:
        example: summarize
        type: string
      plugin:
        example: core-skills
        type: string
    type: object
  handlers.skillsRefreshResponse:
    properties:
      status:
        example: triggered
        type: string
    type: object
  handlers.skillsResponse:
    properties:
      commit:
        type: string
      enabled:
        type: boolean
      ref:
        type: string
      repo:
        type: string
      skills:
        items:
          $ref: '#/definitions/handlers.skillItem'
        type: array
      skipped:
        items:
          $ref: '#/definitions/handlers.skippedItem'
        type: array
      sync:
        $ref: '#/definitions/handlers.skillsSyncStatus'
      synced_at:
        type: string
    type: object
  handlers.skillsSyncStatus:
    properties:
      consecutive_failures:
        type: integer
      last_attempt:
        type: string
      last_error:
        type: string
      last_success:
        type: string
    type: object
  handlers.skippedItem:
    properties:
      path:
        example: plugins/x/skills/bad
        type: string
      reason:
        type: string
    type: object
  model.HealthInfo:
    properties:
      status:
        type: string
      timestamp:
        type: string
    type: object
  model.VersionInfo:
    properties:
      appName:
        type: string
      buildTime:
        type: string
      version:
        type: string
    type: object
info:
  contact: {}
  description: OpenAI-compatible HTTP API backed by the Claude Code CLI.
  license:
    name: MIT
  title: Claude OpenAI-compatible API
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      consumes:
      - application/json
      description: Returns the current health status of the application.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthInfo'
      summary: Get health status
      tags:
      - System
  /api/v1/skills:
    get:
      description: 'Lists the skills of the current snapshot and the health of the
        sync. Returns `{"enabled":false}` when no skills repository is configured.
        Internal port only: unauthenticated.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.skillsResponse'
      summary: Skills status
      tags:
      - Skills
  /api/v1/skills/refresh:
    post:
      description: 'Asks the background syncer to sync now (non-blocking, coalesced)
        and returns 202. Poll `GET /api/v1/skills` for the result. 404 `skills_disabled`
        when no skills repository is configured. Internal port only: unauthenticated.'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.skillsRefreshResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      summary: Trigger a skills sync
      tags:
      - Skills
  /api/v1/version:
    get:
      consumes:
      - application/json
      description: Returns build and version metadata.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.VersionInfo'
      summary: Get version information
      tags:
      - System
  /metrics:
    get:
      description: Exposes Prometheus-compatible metrics.
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus metrics text
          schema:
            type: string
      summary: Prometheus metrics
      tags:
      - System
  /v1/chat/completions:
    post:
      consumes:
      - application/json
      description: |-
        OpenAI-compatible chat completion backed by the Claude Code CLI. With stream true the response is a text/event-stream of chat.completion.chunk events ending with data: [DONE].
        Used fields: model (empty uses the server default), messages (string or text-part content; roles system, developer, user, assistant), stream (SSE when true), stream_options.include_usage (final usage chunk).
        Ignored without error: temperature, top_p, max_tokens, max_completion_tokens, stop, presence_penalty, frequency_penalty, seed, user, response_format, logit_bias, metadata.
        Rejected with 400: tools/functions/tool_calls/function_call and tool or function roles (unsupported_parameter), n > 1 (unsupported_parameter), non-text content parts (unsupported_content_type).
      parameters:
      - description: Chat completion request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.chatRequestDoc'
      produces:
      - application/json
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.chatCompletion'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.openAIErrorDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.openAIErrorDoc'
        "404":
          description: model_not_found
          schema:
            $ref: '#/definitions/handlers.openAIErrorDoc'
        "413":
          description: request_too_large
          schema:
            $ref: '#/definitions/handlers.openAIErrorDoc'
        "429":
          description: rate_limit_exceeded or server_busy
          schema:
            $ref: '#/definitions/handlers.openAIErrorDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.openAIErrorDoc'
        "502":
          description: upstream_error or upstream_auth_error
          schema:
            $ref: '#/definitions/handlers.openAIErrorDoc'
        "504":
          description: upstream_timeout
          schema:
            $ref: '#/definitions/handlers.openAIErrorDoc'
      security:
      - BearerAuth: []
      summary: Create a chat completion
      tags:
      - OpenAI
  /v1/models:
    get:
      description: OpenAI-compatible model list. The ids come from the -claude-models
        flag; `created` is the process start time.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.modelList'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.openAIErrorDoc'
      security:
      - BearerAuth: []
      summary: List models
      tags:
      - OpenAI
  /v1/models/{model}:
    get:
      description: Returns one advertised model, or 404 `model_not_found`.
      parameters:
      - description: Model id
        in: path
        name: model
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.modelObject'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.openAIErrorDoc'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.openAIErrorDoc'
      security:
      - BearerAuth: []
      summary: Retrieve a model
      tags:
      - OpenAI
securityDefinitions:
  BearerAuth:
    description: '"Bearer <key>". Only enforced when CLAUDEAI_API_KEYS is set.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
